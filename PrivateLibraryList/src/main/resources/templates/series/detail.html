<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title>シリーズ詳細</title>
<script>
function enableEdit() {
	const formerName = document.getElementById('formerName').textContent;
	const seriesName = document.getElementById('seriesName').value;
	if (seriesName == formerName) {
		document.getElementById('edit').disabled = true;
	} else {
		document.getElementById('edit').disabled = false;
	}
}

window.onload = function() {
	const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
	const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))
}

</script>
</head>
<body>
	<div layout:fragment="content">
		<div class="header border-bottom mx-1">
			<div class="d-flex row justify-content-start">
				<div class="d-flex col-auto d-inline">
					<h1 class="h3">シリーズ詳細</h1>
					<a class="btn btn-primary mx-3 d-none d-md-block" th:href="@{'/series/add/' + ${series.id}}">シリーズ書籍新規登録</a>
					<a class="btn btn-primary mx-3 d-md-none" th:href="@{'/series/add/' + ${series.id}}">書籍登録</a>
					<a class="btn btn-secondary" th:href="@{/series/list}" style="height: 38px;">戻る</a>
				</div>
				<h1 class="h5 my-1 col-md" th:text="${series.seriesName}" id="formerName"></h1>
			</div>
		</div>
		<div class="d-flex my-3">			
			<form method="post"  th:object="${seriesForm}" th:action="@{'/series/detail/' + *{id}}" >
				<input type="hidden" th:field="*{userId}">
				<div class="row">
					<div class="col-7 col-md-auto mb-1">
						<input type="text" class="form-control" th:field="*{seriesName}" oninput="enableEdit()" th:errorclass="is-invalid">
						<div class="invalid-feedback" th:errors="*{seriesName}"></div>
					</div>
					<div class="col-auto mb-1">
						<button type="submit" class="btn btn-primary mx-1" name="edit" id="edit" disabled>修正</button>
						<th:block th:if="${seriesBookList.size() == 0}">
							<button type="submit" class="btn btn-danger" name="delete">削除</button>
						</th:block>	
						<th:block th:if="${seriesBookList.size() gt 0}">
							<span class="m-0 p-0" data-bs-toggle="tooltip" data-bs-placement="right" data-bs-title="書籍があるため削除できません">
								<a class="btn btn-danger mx-0 disabled">削除</a>
							</span>
						</th:block>	
					</div>
					<!--
					<div class="col-sm-auto mb-1">
						<th:block th:if="${seriesBookList.size() == 0}">
							<button type="submit" class="btn btn-danger mx-1" name="delete">削除</button>
						</th:block>						
						<th:block th:if="${seriesBookList.size() gt 0}">
							<div class="col-auto">
								<a class="btn btn-danger mx-1" data-bs-toggle="collapse" href="#cantDispose" role="button" aria-expanded="false" aria-controls="cantDispose">削除</a>
								<span class="collapse text-danger my-1" id="cantDispose">該当する書籍があるため削除できません</span>
							</div>
						</th:block>	
					</div>
					-->
				</div>
			</form>	
		</div>
		
		<table class="table table-bordered table-striped table-hover">
			<thead class="table-light">
				<tr>
					<th scope="col" class="d-none d-sm-table-cell">タイトル</th>
					<th scope="col" class="d-none d-sm-table-cell">著者</th>
					<th scope="col" class="d-none"></th>
					<th scope="col" class="d-none d-sm-table-cell">巻数</th>
					<th scope="col" class="d-none d-md-table-cell">出版社</th>
					<th scope="col" class="d-none d-md-table-cell">購入日</th>
					<th scope="col" class="d-none d-sm-table-cell">読了日</th>
					<th scope="col" class="d-none d-sm-table-cell"></th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="item: ${seriesBookList}" th:classappend="${item.isDisposed == 1}? text-decoration-line-through">
					<td scope="row" th:text="${item.bookTitle}" class="d-none d-sm-table-cell"></td>
					<td th:text="${item.author}" class="d-none d-sm-table-cell"></td>
					<!--
					<th class="d-sm-none">
						<span class="fw-bold text-truncate d-inline-block" th:text="${item.bookTitle}" style="max-width: 170px;"></span><br>
						<span class="fw-normal text-truncate d-inline-block" th:text="${item.author}" style="max-width: 170px;"></span>
					</th>
					-->
					<td class="d-sm-none">
						<div class="row d-flex justify-content-between">
							<div class="col-auto">
								<span class="fw-bold text-truncate d-inline-block my-0" th:text="${item.bookTitle}"
								th:classappend="${item.isDisposed == 1}? text-decoration-line-through" style="max-width: 170px;"></span><br>
								<span class="fw-normal text-truncate d-inline-block my-0" th:text="${item.author}"
								th:classappend="${item.isDisposed == 1}? text-decoration-line-through" style="max-width: 170px;"></span>
							</div>
							<div class="col-auto  d-flex align-items-center">
								<th:block th:if="${item.finishedDate == null}">
									<span class="text-danger">未読</span>
								</th:block>
							</div>
						</div>
					</td>
					<td th:text="${item.volNum}" class="align-middle"></td>
					<td th:text="${item.publisher.publisherName}" class="d-none d-md-table-cell"></td>
					<td th:text="${#dates.format(item.purchasedDate,'YYYY/MM/dd')}" class="d-none d-lg-table-cell"></td>
					<td th:text="${item.finishedDate == null}? '未' : ${#dates.format(item.finishedDate,'YYYY/MM/dd')}" class="d-none d-lg-table-cell"></td>
					<td th:text="${#dates.format(item.purchasedDate,'MM/dd')}" class="d-none d-md-table-cell d-lg-none"></td>
					<td th:text="${item.finishedDate == null}? '未' : ${#dates.format(item.finishedDate,'MM/dd')}" class="d-none d-sm-table-cell d-lg-none"></td>
					<td class="text-center align-middle">
						<form method="post" th:action="@{'/book/detail/' + ${item.id}}">
							<input type="hidden" name="backURL" th:value="'/series/detail/' + ${series.id}">
							<input type="submit" th:value="詳細" class="btn btn-sm btn-info">
						</form>
					</td>
				</tr>
			</tbody>
		</table>
		
	</div>
</body>
</html>
