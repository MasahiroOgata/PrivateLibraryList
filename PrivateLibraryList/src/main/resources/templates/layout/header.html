<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org"
	   xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	   layout:decorate="~{layout/layout}">
<head>
</head>
<body>
	<nav layout:fragment="header"
		class="navbar navbar-fixed-top navbar-dark bg-primary navbar-expand-md">
		<div class="container-fluid">
			<div class="navbar-header">
				<a class="navbar-brand" th:href="@{/book/list}">蔵書一覧</a>
				<a class="navbar-brand" th:href="@{/series/list}">シリーズ一覧</a>
				<a class="navbar-brand" th:href="@{/publisher/list}">出版社一覧</a>
			</div>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
			data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" 
			aria-expanded="false" aria-label="Toggle navigation">
		      <span class="navbar-toggler-icon"></span>
		    </button>
			<div class="collapse navbar-collapse justify-content-end"  id="navbarSupportedContent">
				<span class="navbar-brand" th:text="|${#authentication.principal.nickname}さん|"></span>
				<form method="post" th:action="@{/logout}">
					<button class="btn btn-link navbar-brand" type="submit">
						ログアウト
					</button>
				</form>
			</div>
		</div>
	</nav>
</body>
</html>
